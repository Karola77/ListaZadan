<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moja Lista Zadań</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container main-container">

<div class="header-box">
    <h1>🌸 Moja Lista Zadań</h1>
    <p class="subtitle">Zarządzaj swoimi zadaniami w prosty sposób</p>
    <button id="darkModeBtn" class="btn btn-pink">🌙 Tryb ciemny</button>
</div>

<div class="form-box">
<form id="taskForm">

<label>Nazwa zadania</label>
<input type="text" name="taskName" id="taskName" class="form-control big-input">

<label class="mt-3">Priorytet</label>
<select name="priority" id="priority" class="form-select big-input">
<option value="">Wybierz priorytet</option>
<option>Wysoki</option>
<option>Średni</option>
<option>Niski</option>
</select>

<button type="submit" class="btn btn-pink btn-lg mt-4 w-100">
➕ Dodaj zadanie
</button>

</form>
</div>

<div class="table-box">
<table id="taskTable" class="display">
<thead>
<tr>
<th>Zadanie</th>
<th>Priorytet</th>
<th>Status</th>
<th>Akcja</th>
</tr>
</thead>
<tbody></tbody>
</table>
</div>

</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jquery-validation@1.19.5/dist/jquery.validate.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
<script src="script.js"></script>

</body>
</html>
